name: Terraform

on:
  push:
    branches: [master]
    paths: ['terraform/**']
  pull_request:
    branches: [master]
    paths: ['terraform/**']
  workflow_dispatch:

concurrency:
  group: terraform-xomforms-infrastructure
  cancel-in-progress: false

permissions:
  id-token: write # mint the OIDC token traded for the plan/apply role
  contents: read
  pull-requests: write

env:
  TF_DIR: terraform
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.7"

      # Read-only for plans, admin only for an apply on master. Selecting the
      # role by event means a pull request cannot assume the role that
      # mutates, regardless of what the workflow later does.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.AWS_TERRAFORM_APPLY_ROLE_ARN || secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        # Tee to disk so the comment step can read it without stuffing the
        # whole plan into argv/env (Linux ARG_MAX = 128KB combined; large
        # plans blow past that).
        run: terraform plan -no-color -input=false -lock=false 2>&1 | tee /tmp/tf-plan.txt
        continue-on-error: true
        # No TF_VAR_* env vars needed yet -- xomforms-infrastructure has no
        # required (no-default) variables as of Phase 2. Add here if/when
        # one is introduced, matching meals-infrastructure's
        # TF_VAR_api_secret_key / TF_VAR_anthropic_api_key pattern.

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/tf-plan.txt')
              ? fs.readFileSync('/tmp/tf-plan.txt', 'utf8')
              : 'No output';
            const truncated = raw.length > 60000
              ? raw.substring(0, 60000) + '\n... truncated'
              : raw;
            const body = '## Terraform Plan\n```\n' + truncated + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
